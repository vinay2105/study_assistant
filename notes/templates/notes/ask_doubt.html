<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask Doubt</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Inter:wght@300;400;500;600&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ... (keep all your existing styles) ... */
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Inter:wght@300;400;500;600&display=swap');
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#0c0c1a 0%,#1a0033 50%,#0f0f23 100%);color:#e2e8f0;overflow:hidden;position:relative;min-height:100vh;}
        body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 20% 80%,rgba(120,119,198,0.3) 0%,transparent 50%),radial-gradient(circle at 80% 20%,rgba(255,255,255,0.1) 0%,transparent 50%),radial-gradient(circle at 40% 40%,rgba(120,219,255,0.1) 0%,transparent 50%);animation:float 20s ease-in-out infinite;z-index:-1;}
        @keyframes float{0%,100%{transform:translateY(0px) rotate(0deg);}50%{transform:translateY(-20px) rotate(2deg);}}
        
        .animated-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;overflow:hidden;}
        .floating-shapes{position:absolute;width:100%;height:100%;}
        .shape{position:absolute;opacity:0.12;animation:floatShape 18s infinite ease-in-out;}
        .shape1{top:15%;left:8%;font-size:60px;color:#a8b8ff;animation-delay:0s;}
        .shape2{top:55%;left:85%;font-size:70px;color:#ff9fd8;animation-delay:3s;}
        .shape3{top:75%;left:15%;font-size:55px;color:#ffd700;animation-delay:6s;}
        .shape4{top:25%;left:75%;font-size:65px;color:#90e0ef;animation-delay:9s;}
        @keyframes floatShape{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-20px) rotate(180deg);}}
        
        .navbar{background:linear-gradient(145deg,rgba(40,40,70,0.95),rgba(30,30,60,0.95));backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.1);padding:15px 30px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 32px rgba(0,0,0,0.4);position:sticky;top:0;z-index:1000;}
        .navbar::before {content:'';position:absolute;bottom:0;left:0;width:100%;height:3px;background:linear-gradient(90deg,#667eea,#764ba2);opacity:0.8;}
        
        .logo{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:700;color:#e8e8f0;text-decoration:none;transition:all 0.3s;}
        .logo:hover {color:#a8b8ff;text-shadow:0 0 15px rgba(168,184,255,0.5);}
        .logo i{font-size:26px;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 8px rgba(102,126,234,0.4));}
        
        .nav-right{display:flex;align-items:center;gap:15px;}
        .nav-btn{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,rgba(102,126,234,0.2),rgba(118,75,162,0.2));backdrop-filter:blur(15px);border:2px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;color:#e8e8f0;cursor:pointer;transition:all 0.3s;text-decoration:none;position:relative;overflow:hidden;}
        .nav-btn::before {content:'';position:absolute;top:50%;left:50%;width:0;height:0;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);transition:all 0.3s;transform:translate(-50%,-50%);}
        .nav-btn:hover::before {width:100%;height:100%;}
        .nav-btn:hover {background:linear-gradient(135deg,rgba(102,126,234,0.4),rgba(118,75,162,0.4));border-color:rgba(102,126,234,0.5);color:#fff;transform:scale(1.12) rotate(5deg);box-shadow:0 8px 25px rgba(102,126,234,0.4);}
        .nav-btn i{font-size:20px;position:relative;z-index:1;}
        .nav-btn.active {background:linear-gradient(135deg,#667eea,#764ba2);border-color:rgba(255,255,255,0.3);color:#fff;box-shadow:0 6px 20px rgba(102,126,234,0.5);}
        
        .chat-wrapper{
    max-width:900px;
    margin:0 auto;
    height:calc(100vh - 80px);
    display:flex;
    flex-direction:column;
    padding:20px 24px 24px;
    overflow:hidden;
}

        .chat-header{padding:24px;background:linear-gradient(135deg,rgba(30,41,59,0.9),rgba(51,65,85,0.9));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);border-radius:20px;font-family:'Orbitron',monospace;font-size:20px;font-weight:700;text-align:center;color:#00ffff;text-shadow:0 2px 10px rgba(0,255,255,0.3);box-shadow:0 20px 40px rgba(0,0,0,0.3);margin-bottom:20px;position:relative;overflow:hidden;}
        .chat-header::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent);animation:shimmer 3s infinite;}
        @keyframes shimmer{0%{left:-100%;}100%{left:100%;}}
        .chat-box{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px;background:rgba(15,23,42,0.6);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);border-radius:20px;border:1px solid rgba(255,255,255,0.08);box-shadow:inset 0 10px 30px rgba(0,0,0,0.3);}
        .chat-box::-webkit-scrollbar{width:6px;}
        .chat-box::-webkit-scrollbar-track{background:rgba(255,255,255,0.05);border-radius:10px;}
        .chat-box::-webkit-scrollbar-thumb{background:linear-gradient(#667deb,#753fa2);border-radius:10px;}
        .message{max-width:75%;padding:16px 20px;border-radius:20px 20px 20px 5px;word-wrap:break-word;white-space:pre-wrap;font-size:15px;line-height:1.5;box-shadow:0 8px 25px rgba(0,0,0,0.3);position:relative;animation:slideIn 0.4s cubic-bezier(0.4,0,0.2,1);}
        @keyframes slideIn{from{opacity:0;transform:translateY(20px) scale(0.95);}to{opacity:1;transform:translateY(0) scale(1);}}
        .user{align-self:flex-end;background:linear-gradient(135deg,#2563eb,#4f46e5);border-bottom-right-radius:5px;color:#fff;}
        .assistant{align-self:flex-start;background:linear-gradient(135deg,#334155,#475569);border-bottom-left-radius:5px;color:#e2e8f0;}
        .empty{text-align:center;opacity:0.6;font-style:italic;color:#94a3b8;padding:40px;font-size:16px;}
        .chat-form{display:flex;padding:20px;background:linear-gradient(135deg,rgba(30,41,59,0.9),rgba(51,65,85,0.9));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);border-radius:20px;gap:12px;box-shadow:0 20px 40px rgba(0,0,0,0.3);}
        .chat-form input{flex:1;padding:16px 20px;border-radius:16px;border:1px solid rgba(255,255,255,0.1);outline:none;font-size:15px;background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#e2e8f0;transition:all 0.3s ease;}
        .chat-form input::placeholder{color:#94a3b8;}
        .chat-form input:focus{border-color:rgba(37,99,235,0.5);background:rgba(255,255,255,0.08);box-shadow:0 0 0 3px rgba(37,99,235,0.1);}
        .chat-form button{padding:16px 24px;border:none;border-radius:16px;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;cursor:pointer;font-size:15px;font-weight:600;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);box-shadow:0 8px 25px rgba(37,99,235,0.3);position:relative;overflow:hidden;}
        .chat-form button:hover{background:linear-gradient(135deg,#1d4ed8,#4338ca);transform:translateY(-2px);box-shadow:0 15px 35px rgba(37,99,235,0.4);}
        .chat-form button:active{transform:translateY(0);}
        .chat-form button:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
        
        /* Loading indicator */
        .loading{align-self:flex-start;max-width:75%;padding:16px 20px;border-radius:20px 20px 20px 5px;background:linear-gradient(135deg,#334155,#475569);color:#e2e8f0;display:flex;gap:8px;align-items:center;}
        .loading-dot{width:8px;height:8px;border-radius:50%;background:#e2e8f0;animation:bounce 1.4s infinite ease-in-out both;}
        .loading-dot:nth-child(1){animation-delay:-0.32s;}
        .loading-dot:nth-child(2){animation-delay:-0.16s;}
        @keyframes bounce{0%,80%,100%{transform:scale(0);}40%{transform:scale(1);}}
        
        @media(max-width:768px) {
            .navbar {padding:12px 20px;}
            .logo {font-size:18px;}
            .logo i {font-size:22px;}
            .nav-right {gap:10px;}
            .nav-btn {width:40px;height:40px;}
            .nav-btn i {font-size:18px;}
            .chat-wrapper{padding:20px 16px 16px;}

            .chat-header{padding:20px 16px;font-size:18px;border-radius:16px;}
            .chat-box{padding:16px;border-radius:16px;}
            .message{max-width:90%;padding:14px 16px;font-size:14px;}
            .chat-form{padding:16px;border-radius:16px;flex-direction:column;}
            .chat-form input{border-radius:12px;}
            .chat-form button{border-radius:12px;padding:14px 20px;}
        }
        @media (max-width:480px){
            .chat-header{font-size:16px;}
        }
    </style>
</head>
<body>
    <div class="animated-bg">
        <div class="floating-shapes">
            <i class="fas fa-book shape shape1"></i>
            <i class="fas fa-lightbulb shape shape2"></i>
            <i class="fas fa-brain shape shape3"></i>
            <i class="fas fa-atom shape shape4"></i>
        </div>
    </div>
    
    <nav class="navbar">
        <a href="{% url 'home' %}" class="logo">
            <i class="fas fa-graduation-cap"></i>
            <span>Study Assistant</span>
        </a>
        <div class="nav-right">
            <a href="{% url 'home' %}" class="nav-btn home-btn" title="Home">
                <i class="fas fa-home"></i>
            </a>
            <a href="{% url 'history' %}" class="nav-btn history-btn" title="History">
                <i class="fas fa-history"></i>
            </a>
            <a href="{% url 'profile' %}" class="nav-btn profile-btn" title="Profile">
                <i class="fas fa-user"></i>
            </a>
        </div>
    </nav>

    <div class="chat-wrapper">
        <div class="chat-header">
            Chat about: {{ note.title }}
        </div>

        <div class="chat-box" id="chatBox">
            {% for chat in chats %}
                <div class="message {{ chat.role }}">
                    {{ chat.text|linebreaksbr }}
                </div>
            {% empty %}
                <div class="empty" id="emptyMessage">
                    No chats yet. Ask your first doubt.
                </div>
            {% endfor %}
        </div>

        <form method="POST" class="chat-form" id="chatForm">
            {% csrf_token %}
            <input
                type="text"
                name="question"
                id="questionInput"
                placeholder="Ask your doubt..."
                required
                autocomplete="off"
            >
            <button type="submit" id="sendBtn">Send</button>
        </form>
    </div>

    <script>
    const chatBox = document.getElementById("chatBox");
    const chatForm = document.getElementById("chatForm");
    const questionInput = document.getElementById("questionInput");
    const sendBtn = document.getElementById("sendBtn");
    const emptyMessage = document.getElementById("emptyMessage");

    // Get CSRF token function
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    // Scroll to bottom function
    function scrollToBottom() {
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Initial scroll
    scrollToBottom();

    // Function to add message to chat
    function addMessage(text, role) {
        const messageDiv = document.createElement("div");
        messageDiv.className = `message ${role}`;
        // Replace \n with <br> for line breaks
        messageDiv.innerHTML = text.replace(/\n/g, '<br>');
        chatBox.appendChild(messageDiv);
        scrollToBottom();
    }

    // Function to show loading indicator
    function showLoading() {
        const loadingDiv = document.createElement("div");
        loadingDiv.className = "loading";
        loadingDiv.id = "loadingIndicator";
        loadingDiv.innerHTML = '<div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div>';
        chatBox.appendChild(loadingDiv);
        scrollToBottom();
    }

    // Function to remove loading indicator
    function removeLoading() {
        const loadingIndicator = document.getElementById("loadingIndicator");
        if (loadingIndicator) {
            loadingIndicator.remove();
        }
    }

    // Handle form submission with AJAX
    chatForm.addEventListener("submit", function(e) {
        e.preventDefault();

        const question = questionInput.value.trim();
        if (!question) return;

        // Remove empty message if exists
        if (emptyMessage) {
            emptyMessage.remove();
        }

        // Add user message immediately
        addMessage(question, "user");

        // Clear input and disable form
        questionInput.value = "";
        sendBtn.disabled = true;
        sendBtn.textContent = "Sending...";

        // Show loading indicator
        showLoading();

        // Get CSRF token
        const csrftoken = getCookie('csrftoken');

        // Prepare form data
        const formData = new FormData();
        formData.append('question', question);

        // Send AJAX request with proper credentials and CSRF
        fetch(window.location.href, {
            method: "POST",
            headers: {
                "X-CSRFToken": csrftoken,
                "X-Requested-With": "XMLHttpRequest"
            },
            body: formData,
            credentials: 'same-origin'  // Important: Include cookies
        })
        .then(response => {
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.json();
        })
        .then(data => {
            // Remove loading indicator
            removeLoading();

            if (data.success) {
                // Add assistant response
                addMessage(data.response, "assistant");
            } else {
                // Show error message
                addMessage(data.error || "Something went wrong. Please try again.", "assistant");
            }

            // Re-enable form
            sendBtn.disabled = false;
            sendBtn.textContent = "Send";
            questionInput.focus();
        })
        .catch(error => {
            console.error("Error:", error);
            removeLoading();
            addMessage("Error: " + error.message + ". Please try again.", "assistant");
            sendBtn.disabled = false;
            sendBtn.textContent = "Send";
        });
    });
</script>

</body>
</html>
