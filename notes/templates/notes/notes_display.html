<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Notes - Study Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" relstylesheet>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Inter:wght@300;400;500;600&display=swap" relstylesheet>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
    /* Base - NO SCROLL */
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{height:100%!important;overflow:hidden!important;}
    body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#1e1e3f 0%,#2a1f5a 50%,#1a1a40 100%)!important;color:#e8e8f0;position:relative;}
    
    /* Static Background */
    .animated-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;overflow:hidden;}
    .floating-shapes{position:absolute;width:100%;height:100%;}
    .shape{position:absolute;opacity:0.08;}
    .shape1{top:15%;left:8%;font-size:60px;color:#a8b8ff;}
    .shape2{top:55%;left:85%;font-size:70px;color:#ff9fd8;}
    .shape3{top:75%;left:15%;font-size:55px;color:#ffd700;}
    .shape4{top:25%;left:75%;font-size:65px;color:#90e0ef;}
    
    /* Navbar Fixed */
    .navbar{position:fixed;top:0;left:0;right:0;z-index:9999;background:linear-gradient(135deg,rgba(10,15,35,0.98) 0%,rgba(20,25,55,0.98) 100%);backdrop-filter:blur(30px) saturate(180%);border-bottom:1px solid rgba(0,255,204,0.3);box-shadow:0 8px 32px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.1);width:100%;padding:15px 30px;display:flex;justify-content:space-between;align-items:center;}
    .navbar .logo{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:700;color:#e8e8f0;text-decoration:none;transition:all 0.3s;}
    .logo i{font-size:26px;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 8px rgba(102,126,234,0.4));}
    .nav-right{display:flex;align-items:center;gap:15px;}
    .nav-btn{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,rgba(102,126,234,0.2),rgba(118,75,162,0.2));backdrop-filter:blur(15px);border:2px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;color:#e8e8f0;cursor:pointer;transition:all 0.3s;text-decoration:none;position:relative;overflow:hidden;}
    .nav-btn::before{content:'';position:absolute;top:50%;left:50%;width:0;height:0;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);transition:all 0.3s;transform:translate(-50%,-50%);}
    .nav-btn:hover::before{width:100%;height:100%;}
    .nav-btn:hover{background:linear-gradient(135deg,rgba(102,126,234,0.4),rgba(118,75,162,0.4));border-color:rgba(102,126,234,0.5);color:#fff;transform:scale(1.12) rotate(5deg);box-shadow:0 8px 25px rgba(102,126,234,0.4);}
    .nav-btn i{font-size:20px;}
    
    /* SINGLE SCROLLABLE CONTENT */
    .main-content{position:fixed;top:90px;left:0;right:0;bottom:0;width:100%;height:calc(100vh - 90px);overflow-y:auto;background:linear-gradient(145deg,rgba(15,20,45,0.97) 0%,rgba(25,30,65,0.97) 100%);backdrop-filter:blur(35px) saturate(160%);padding:3rem 2.5rem;max-width:1400px;margin:0 auto;display:flex;flex-direction:column;align-items:center;}
    .main-content::-webkit-scrollbar{width:12px;}
    .main-content::-webkit-scrollbar-track{background:rgba(20,25,50,0.8);border-radius:10px;border:2px solid transparent;background-clip:content-box;}
    .main-content::-webkit-scrollbar-thumb{background:linear-gradient(135deg,#00ffcc 0%,#ff1493 50%,#00ffff 100%);border-radius:10px;border:3px solid rgba(20,25,50,0.8);box-shadow:0 0 20px rgba(0,255,204,0.4);}
    .main-content::-webkit-scrollbar-thumb:hover{background:linear-gradient(135deg,#00ffff 0%,#ff1493 50%,#00ffcc 100%);box-shadow:0 0 30px rgba(0,255,255,0.6);}
    
    /* Content */
    .main-content *{font-family:'Inter',sans-serif;line-height:1.75;max-width:100%;}
    .main-content h1{font-family:'Orbitron',monospace;font-size:clamp(2.8rem,6vw,4.5rem);font-weight:800;text-align:center;background:linear-gradient(135deg,#00ffcc 0%,#ff1493 40%,#00ffff 80%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin:0 0 2.5rem 0;letter-spacing:-0.02em;position:relative;width:100%;}
    .main-content h1::after{content:'';position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);width:120px;height:4px;background:linear-gradient(90deg,transparent,#00ffcc,#ff1493,transparent);border-radius:2px;}
    .main-content h2{font-family:'Orbitron',monospace;font-size:clamp(1.6rem,3vw,2.3rem);font-weight:700;color:#e8f4ff;margin:2.5rem 0 1.5rem 0;padding:1rem 1.5rem;width:100%;background:linear-gradient(90deg,transparent 0%,rgba(0,255,204,0.1) 50%,transparent 100%);border-radius:12px;position:relative;}
    .main-content h2::before{content:'▸';color:#ff1493;font-size:1.4em;margin-right:1rem;opacity:0.9;}
    .main-content h3{font-family:'Orbitron',monospace;font-size:1.4rem;color:#00ffff;margin:2rem 0 1rem 0;font-weight:600;width:100%;}
    .main-content ul{list-style:none;padding:0;width:100%;}
    .main-content li{background:linear-gradient(135deg,rgba(0,255,204,0.08) 0%,rgba(255,20,147,0.06) 100%);backdrop-filter:blur(10px);border:1px solid rgba(0,255,204,0.15);border-radius:20px;margin:1rem 0;padding:1.8rem 2.2rem 1.8rem 3.5rem;transition:all 0.4s cubic-bezier(0.25,0.8,0.25,1);position:relative;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.08);width:100%;}
    .main-content li::before{content:'✦';position:absolute;left:1.2rem;top:1.8rem;color:#00ffcc;font-size:1.1rem;font-weight:bold;z-index:2;}
    .main-content li:hover{transform:translateY(-6px) scale(1.01);box-shadow:0 20px 60px rgba(255,20,147,0.3),0 0 40px rgba(0,255,204,0.35);border-color:rgba(0,255,204,0.5);background:linear-gradient(135deg,rgba(0,255,204,0.12) 0%,rgba(255,20,147,0.1) 100%);}
    .main-content p{font-size:1.1rem;color:#d8e8ff;margin:1rem 0;text-align:justify;font-weight:400;width:100%;}
    .main-content strong{color:#ff1493;font-weight:600;background:rgba(255,20,147,0.15);padding:0.2rem 0.6rem;border-radius:6px;margin:0 0.2rem;}
    
    /* Ask Doubt Button - Icon Only */
    .ask-doubt{position:fixed;bottom:30px;right:30px;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#00ffcc,#ff1493);border:none;box-shadow:0 10px 40px rgba(0,255,204,0.4);display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.8rem;cursor:pointer;transition:all 0.3s;z-index:1000;text-decoration:none;}
    .ask-doubt:hover{transform:scale(1.1) rotate(360deg);box-shadow:0 15px 50px rgba(0,255,204,0.6);}
    
    /* Responsive */
    @media (max-width:768px){.navbar{padding:12px 20px;}.logo{font-size:18px;}.logo i{font-size:22px;}.nav-right{gap:10px;}.nav-btn{width:40px;height:40px;}.nav-btn i{font-size:18px;}.main-content{padding:2rem 1.5rem;}.ask-doubt{width:55px;height:55px;bottom:20px;right:20px;font-size:1.6rem;}}
    </style>
</head>
<body>
    <!-- BACKGROUND -->
    <div class="animated-bg">
        <div class="floating-shapes">
            <i class="fas fa-book shape shape1"></i>
            <i class="fas fa-lightbulb shape shape2"></i>
            <i class="fas fa-brain shape shape3"></i>
            <i class="fas fa-atom shape shape4"></i>
        </div>
    </div>
    
    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="/" class="logo">
            <i class="fas fa-graduation-cap"></i>
            <span>Study Assistant</span>
        </a>
        <div class="nav-right">
            <a href="{% url 'home' %}" class="nav-btn" title="Home"><i class="fas fa-home"></i></a>
            
            <a href="{% url 'history' %}" class="nav-btn history-btn" title="History">
    <i class="fas fa-history"></i>
</a>
<a href="{% url 'profile' %}" class="nav-btn" title="Profile"><i class="fas fa-user"></i></a>
        </div>
    </nav>
    
    <!-- ONLY ONE SCROLLABLE SECTION -->
    <main class="main-content">
        {% autoescape off %}{{ generated_note }}{% endautoescape %}
    </main>
    
    <!-- ASK DOUBT - ICON ONLY -->
    <a href="{% url 'ask_doubt' note.id %}" class="ask-doubt" title="Ask Doubt">
        <i class="fas fa-question"></i>
    </a>
</body>
</html>
