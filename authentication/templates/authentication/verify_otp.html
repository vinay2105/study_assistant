<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP | Study Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* SCROLL & STRUCTURE */
        * {box-sizing:border-box;margin:0;padding:0;}
        html {scroll-behavior:smooth;overflow-x:hidden;}
        body {font-family:'Poppins',sans-serif;overflow-y:auto !important;overflow-x:hidden;min-height:100vh;background:linear-gradient(135deg,#1e1e3f 0%,#2a1f5a 50%,#1a1a40 100%);color:#e8e8f0;line-height:1.6;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
        
        /* ANIMATED BACKGROUND */
        .animated-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;overflow:hidden;}
        .floating-shapes{position:absolute;width:100%;height:100%;}
        .shape{position:absolute;opacity:0.15;animation:float 18s infinite ease-in-out;}
        .shape1{top:15%;left:8%;font-size:60px;color:#a8b8ff;animation-delay:0s;}
        .shape2{top:55%;left:85%;font-size:70px;color:#ff9fd8;animation-delay:3s;}
        .shape3{top:75%;left:15%;font-size:55px;color:#ffd700;animation-delay:6s;}
        .shape4{top:25%;left:75%;font-size:65px;color:#90e0ef;animation-delay:9s;}
        @keyframes float{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-20px) rotate(180deg);}}
        
        /* MAIN CONTAINER */
        .main-container {max-width:1200px;margin:0 auto;width:100%;position:relative;z-index:10;}
        
        /* OTP CARD - PREMIUM DARK GLASSMorphism */
        .otp-card {background:linear-gradient(145deg,rgba(40,40,70,0.95),rgba(30,30,60,0.95));border:1px solid rgba(255,255,255,0.1);border-radius:25px;padding:50px 40px;width:100%;max-width:420px;margin:0 auto;box-shadow:0 25px 60px rgba(0,0,0,0.5);backdrop-filter:blur(20px);position:relative;overflow:hidden;transition:all 0.4s;text-align:center;}
        .otp-card::before {content:'';position:absolute;top:0;left:0;width:100%;height:4px;background:linear-gradient(90deg,#667eea,#764ba2);box-shadow:0 2px 10px rgba(102,126,234,0.4);}
        .otp-card::after {content:'';position:absolute;top:20px;right:25px;width:60px;height:60px;background:linear-gradient(135deg,#ff4768,#ff2e63);border-radius:50%;opacity:0.1;}
        
        /* HEADER */
        .otp-header {margin-bottom:35px;}
        .otp-logo {width:70px;height:70px;margin:0 auto 25px;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;box-shadow:0 10px 30px rgba(102,126,234,0.4);animation:pulse 2s infinite;}
        @keyframes pulse {0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
        .otp-title {font-size:28px;font-weight:700;color:#e8e8f0;margin-bottom:12px;text-shadow:0 2px 8px rgba(0,0,0,0.3);}
        .otp-subtitle {font-size:15px;color:#c8c8d8;line-height:1.6;max-width:320px;margin:0 auto;}
        
        /* OTP INPUT - PREMIUM */
        .otp-input-container {position:relative;margin:40px 0;}
        .otp-input {width:100%;padding:22px 20px;background:linear-gradient(145deg,rgba(255,255,255,0.08),rgba(255,255,255,0.04));border:2px solid rgba(255,255,255,0.15);border-radius:20px;font-size:28px;font-weight:600;color:#e8e8f0;text-align:center;letter-spacing:12px;text-transform:uppercase;transition:all 0.3s;backdrop-filter:blur(15px);box-shadow:0 10px 30px rgba(0,0,0,0.3);}
        .otp-input::placeholder {color:#a0a0b8;font-size:16px;letter-spacing:normal;text-transform:none;}
        .otp-input:focus {outline:none;border-color:rgba(102,126,234,0.8);box-shadow:0 0 0 4px rgba(102,126,234,0.15),0 15px 40px rgba(102,126,234,0.2);background:rgba(255,255,255,0.12);}
        .otp-input:hover {border-color:rgba(255,255,255,0.25);}
        .otp-shield {position:absolute;top:15px;right:20px;color:#90e0ef;font-size:20px;opacity:0.6;}
        
        /* BUTTON */
        .btn-verify {padding:18px 40px;border:none;border-radius:25px;font-weight:700;font-size:16px;background:linear-gradient(135deg,#ff4768,#ff2e63);color:#fff;transition:all 0.3s;cursor:pointer;display:block;width:100%;box-shadow:0 10px 30px rgba(255,71,104,0.4);position:relative;overflow:hidden;}
        .btn-verify:hover {box-shadow:0 15px 45px rgba(255,71,104,0.6);transform:translateY(-3px);}
        .btn-verify i {margin-right:10px;}
        
        /* ERROR */
        .error {background:linear-gradient(135deg,rgba(255,71,104,0.2),rgba(255,46,99,0.2));border:1px solid rgba(255,71,104,0.4);color:#ffb3c6;padding:15px;border-radius:15px;font-size:14px;box-shadow:0 5px 20px rgba(255,71,104,0.2);margin-bottom:20px;}
        
        /* RESEND */
        .resend-section {margin-top:30px;padding-top:25px;border-top:1px solid rgba(255,255,255,0.1);}
        .resend-link {color:#90e0ef;font-weight:600;font-size:14px;text-decoration:none;transition:all 0.3s;display:inline-flex;align-items:center;gap:8px;}
        .resend-link:hover {color:#a8b8ff;text-shadow:0 0 10px rgba(168,184,255,0.5);transform:translateX(5px);}
        
        /* RESPONSIVE */
        @media(max-width:480px) {
            body {padding:15px;}
            .otp-card {padding:40px 25px;border-radius:20px;}
            .otp-title {font-size:24px;}
            .otp-input {font-size:24px;letter-spacing:8px;padding:18px 15px;}
        }
        
        .sr-only {position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
    </style>
</head>
<body>
    <!-- ANIMATED BACKGROUND -->
    <div class="animated-bg">
        <div class="floating-shapes">
            <i class="fas fa-book shape shape1"></i>
            <i class="fas fa-lightbulb shape shape2"></i>
            <i class="fas fa-brain shape shape3"></i>
            <i class="fas fa-atom shape shape4"></i>
        </div>
    </div>
    
    <div class="main-container">
        <div class="otp-card">
            <!-- HEADER -->
            <div class="otp-header">
                <div class="otp-logo">
                    <i class="fas fa-shield-check"></i>
                </div>
                <h1 class="otp-title">Verify Your Email</h1>
                <p class="otp-subtitle">Please enter the 4-digit OTP sent to your email address.</p>
            </div>
            
            <!-- ERROR -->
            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}
            
            <!-- OTP FORM -->
            <form method="POST">
                {% csrf_token %}
                <div class="otp-input-container">
                    <i class="fas fa-lock otp-shield"></i>
                    <input type="text" name="otp" maxlength="4" placeholder="0000" class="otp-input" required autocomplete="one-time-code">
                </div>
                <button type="submit" class="btn-verify">
                    <i class="fas fa-check-circle"></i>
                    Verify OTP
                </button>
            </form>
            
            <!-- RESEND -->
            <div class="resend-section">
                
            </div>
        </div>
    </div>
</body>
</html>
