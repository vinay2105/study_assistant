{% load socialaccount %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Study Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* SCROLL & STRUCTURE */
        * {box-sizing:border-box;margin:0;padding:0;}
        html {scroll-behavior:smooth;overflow-x:hidden;}
        body {font-family:'Poppins',sans-serif;overflow-y:auto !important;overflow-x:hidden;min-height:100vh;background:linear-gradient(135deg,#1e1e3f 0%,#2a1f5a 50%,#1a1a40 100%);color:#e8e8f0;line-height:1.6;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
        
        /* ANIMATED BACKGROUND */
        .animated-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;overflow:hidden;}
        .floating-shapes{position:absolute;width:100%;height:100%;}
        .shape{position:absolute;opacity:0.15;animation:float 18s infinite ease-in-out;}
        .shape1{top:15%;left:8%;font-size:60px;color:#a8b8ff;animation-delay:0s;}
        .shape2{top:55%;left:85%;font-size:70px;color:#ff9fd8;animation-delay:3s;}
        .shape3{top:75%;left:15%;font-size:55px;color:#ffd700;animation-delay:6s;}
        .shape4{top:25%;left:75%;font-size:65px;color:#90e0ef;animation-delay:9s;}
        @keyframes float{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-20px) rotate(180deg);}}
        
        /* MAIN CONTAINER */
        .main-container {max-width:1200px;margin:0 auto;width:100%;position:relative;z-index:10;}
        
        /* AUTH CARD - PREMIUM DARK GLASSMorphism */
        .auth-card {background:linear-gradient(145deg,rgba(40,40,70,0.95),rgba(30,30,60,0.95));border:1px solid rgba(255,255,255,0.1);border-radius:25px;padding:50px 40px;width:100%;max-width:420px;margin:0 auto;box-shadow:0 25px 60px rgba(0,0,0,0.5);backdrop-filter:blur(20px);position:relative;overflow:hidden;transition:all 0.4s;}
        .auth-card::before {content:'';position:absolute;top:0;left:0;width:100%;height:4px;background:linear-gradient(90deg,#667eea,#764ba2);box-shadow:0 2px 10px rgba(102,126,234,0.4);}
        .auth-card::after {content:'';position:absolute;top:20px;right:25px;width:60px;height:60px;background:linear-gradient(135deg,#ff4768,#ff2e63);border-radius:50%;opacity:0.1;}
        
        /* HEADER */
        .auth-header {text-align:center;margin-bottom:35px;}
        .auth-logo {width:65px;height:65px;margin:0 auto 20px;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;box-shadow:0 8px 25px rgba(102,126,234,0.4);animation:pulse 2s infinite;}
        @keyframes pulse {0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
        .auth-title {font-size:28px;font-weight:700;color:#e8e8f0;margin-bottom:8px;text-shadow:0 2px 8px rgba(0,0,0,0.3);}
        .auth-subtitle {font-size:15px;color:#c8c8d8;line-height:1.6;}
        
        /* FORM */
        .auth-form {display:flex;flex-direction:column;gap:20px;}
        .form-group {position:relative;}
        label {display:block;font-size:14px;font-weight:600;color:#d0d0e0;margin-bottom:8px;}
        input {width:100%;padding:16px 20px;background:rgba(255,255,255,0.08);border:2px solid rgba(255,255,255,0.1);border-radius:15px;font-size:16px;color:#e8e8f0;transition:all 0.3s;backdrop-filter:blur(10px);}
        input::placeholder {color:#a0a0b8;}
        input:focus {outline:none;border-color:rgba(102,126,234,0.6);box-shadow:0 0 0 4px rgba(102,126,234,0.1);background:rgba(255,255,255,0.12);}
        input:hover {border-color:rgba(255,255,255,0.2);}
        
        /* BUTTONS */
        .btn {padding:16px 30px;border:none;border-radius:20px;font-weight:700;font-size:16px;transition:all 0.3s;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;text-decoration:none;position:relative;overflow:hidden;}
        .btn-primary {background:linear-gradient(135deg,#ff4768,#ff2e63);color:#fff;box-shadow:0 8px 25px rgba(255,71,104,0.4);}
        .btn-primary:hover {box-shadow:0 12px 35px rgba(255,71,104,0.6);transform:translateY(-2px);}
        .btn-google {background:linear-gradient(135deg,#fff,#f8f9fa);color:#333;border:2px solid rgba(255,255,255,0.2);font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,0.2);}
        .btn-google:hover {background:#fff;border-color:rgba(255,255,255,0.4);box-shadow:0 10px 30px rgba(0,0,0,0.3);transform:translateY(-2px);}
        .btn-google i {color:#4285f4;font-size:18px;}
        
        /* ERROR */
        .error {background:linear-gradient(135deg,rgba(255,71,104,0.2),rgba(255,46,99,0.2));border:1px solid rgba(255,71,104,0.4);color:#ffb3c6;padding:15px;border-radius:12px;font-size:14px;text-align:center;box-shadow:0 4px 15px rgba(255,71,104,0.2);}
        
        /* DIVIDER */
        .divider {position:relative;text-align:center;margin:30px 0;color:#a0a0b8;font-size:14px;}
        .divider::before {content:'';position:absolute;top:50%;left:0;width:100%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);}
        .divider span {background:linear-gradient(145deg,rgba(40,40,70,0.95),rgba(30,30,60,0.95));padding:0 20px;position:relative;}
        
        /* FOOTER LINK */
        .auth-footer {text-align:center;margin-top:30px;padding-top:25px;border-top:1px solid rgba(255,255,255,0.1);}
        .auth-footer p {font-size:14px;color:#c8c8d8;margin:0;}
        .auth-footer a {color:#90e0ef;font-weight:600;text-decoration:none;transition:color 0.3s;}
        .auth-footer a:hover {color:#a8b8ff;text-shadow:0 0 8px rgba(168,184,255,0.5);}
        
        /* RESPONSIVE */
        @media(max-width:480px) {
            body {padding:15px;}
            .auth-card {padding:40px 25px;border-radius:20px;}
            .auth-title {font-size:24px;}
        }
        
        .sr-only {position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
    </style>
</head>
<body>
    <!-- ANIMATED BACKGROUND -->
    <div class="animated-bg">
        <div class="floating-shapes">
            <i class="fas fa-book shape shape1"></i>
            <i class="fas fa-lightbulb shape shape2"></i>
            <i class="fas fa-brain shape shape3"></i>
            <i class="fas fa-atom shape shape4"></i>
        </div>
    </div>
    
    <div class="main-container">
        <div class="auth-card">
            <!-- HEADER -->
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-user-graduate"></i>
                </div>
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Join thousands of students mastering their studies with AI</p>
            </div>
            
            <!-- ERROR -->
            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}
            
            <!-- FORM -->
            <form method="POST" class="auth-form">{% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-user-plus"></i>
                    Create Account
                </button>
            </form>
            
            <!-- GOOGLE SIGNUP -->
            <div class="divider">
                <span>or continue with</span>
            </div>
            <a href="{% provider_login_url 'google' %}" class="btn btn-google">
                <i class="fab fa-google"></i>
                Continue with Google
            </a>
            
            <!-- FOOTER -->
            <div class="auth-footer">
                <p>Already registered? <a href="{% url 'login' %}">Login here</a></p>
            </div>
        </div>
    </div>
</body>
</html>
